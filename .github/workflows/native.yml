name: Native Community Bottles

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to build
        required: true
        default: csound
        type: string

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      DISTILL_FORMULA: ${{ inputs.formula }}
      DISTILL_RELEASE_BUILD: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ github.token }}
      HOMEBREW_ARTIFACT_DOMAIN: ${{ vars.DISTILL_ARTIFACT_DOMAIN }}
      HOMEBREW_ARTIFACT_DOMAIN_NO_FALLBACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build and package
        run: |
          test -n "$HOMEBREW_ARTIFACT_DOMAIN"
          ./scripts/native-build "$DISTILL_FORMULA" out
          ./scripts/package-release out release "$GITHUB_RUN_ID-$RUNNER_OS-${{ matrix.arch }}" "$GITHUB_RUN_ATTEMPT"

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distill-${{ matrix.runner }}-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      DISTILL_FORMULA: ${{ inputs.formula }}
      DISTILL_RELEASE_BUILD: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ github.token }}
      HOMEBREW_ARTIFACT_DOMAIN: ${{ vars.DISTILL_ARTIFACT_DOMAIN }}
      HOMEBREW_ARTIFACT_DOMAIN_NO_FALLBACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distill-${{ matrix.runner }}-${{ matrix.arch }}
          path: release/

      - name: Verify on fresh runner
        run: |
          test -n "$HOMEBREW_ARTIFACT_DOMAIN"
          bottle=$(find release -type f -name '*.bottle*.tar.gz' -print | sed -n '1p')
          checksums=$(find release -type f -name checksums.txt -print | sed -n '1p')
          test -n "$bottle"
          test -n "$checksums"
          expected=$(awk -v file="$(basename "$bottle")" '$2 == file { print $1; exit }' "$checksums")
          test -n "$expected"
          ./scripts/native-verify "$DISTILL_FORMULA" "$bottle" "$expected" out/native-verify

      - name: Upload verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distill-verified-${{ matrix.runner }}-${{ matrix.arch }}
          path: out/native-verify/
          if-no-files-found: error
