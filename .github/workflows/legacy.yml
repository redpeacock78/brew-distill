name: Legacy Intel Research Bottle

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Legacy macOS major version
        required: true
        default: "13"
        type: choice
        options:
          - "11"
          - "12"
          - "13"
          - "14"
      installer_version:
        description: Full Installer version accepted by softwareupdate
        required: true
        default: "13.7.8"
        type: string
      batch:
        description: Formula batch JSON
        required: true
        default: '{"formulas":["csound"]}'
        type: string
      install_reboot_timeout:
        description: Seconds to wait for the installer's first reboot
        required: true
        default: "1800"
        type: string
      install_package_mode:
        description: Bootstrap package mode for Legacy diagnosis
        required: true
        default: required
        type: choice
        options:
          - required
          - omit
      qemu_cpu_profile:
        description: QEMU CPU topology profile for Legacy diagnosis
        required: true
        default: current
        type: choice
        options:
          - current
          - 4vcpu
          - 6vcpu
      qemu_cpu_model:
        description: QEMU CPU feature profile for Legacy diagnosis
        required: true
        default: current
        type: choice
        options:
          - current
          - host
      qemu_disk_cache:
        description: QEMU cache mode for the job-local macOS disk
        required: true
        default: writeback
        type: choice
        options:
          - writeback
          - unsafe
      qemu_disk_profile:
        description: disk layout profile for the job-local macOS disk
        required: true
        default: current
        type: choice
        options:
          - current
          - tuned
          - raw
      qemu_disk_device:
        description: QEMU device for the job-local macOS disk
        required: true
        default: sata
        type: choice
        options:
          - sata
          - nvme
      qemu_disk_rotation_rate:
        description: QEMU rotation rate hint for the job-local macOS disk
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      install_target_mode:
        description: startosinstall target selection for Legacy diagnosis
        required: true
        default: auto
        type: choice
        options:
          - auto
          - volume
          - eraseinstall

permissions:
  contents: write
  actions: write

jobs:
  legacy:
    runs-on: macos-15-intel
    env:
      DISTILL_MACOS: ${{ inputs.macos }}
      DISTILL_INSTALLER_VERSION: ${{ inputs.installer_version }}
      DISTILL_SOFTWAREUPDATE_SUDO: "1"
      DISTILL_SOFTWAREUPDATE_ATTEMPTS: "2"
      DISTILL_INSTALLER_CATALOG_PRIMARY: "1"
      DISTILL_INSTALLER_SOFTWAREUPDATE_FALLBACK: "1"
      DISTILL_INSTALLER_DISCOVERY_TIMEOUT: "60"
      DISTILL_INSTALLER_CATALOG_CACHE: out/hvf/installer-catalog-cache.json
      DISTILL_UNATTENDED_CAPTURE_DIR: out/hvf
      DISTILL_UNATTENDED_FRAME_LOG: out/hvf/unattended-frames.jsonl
      DISTILL_UNATTENDED_RECOVERY_MIN_SETTLE: "10"
      DISTILL_UNATTENDED_RECOVERY_STILL_MAX: "240"
      DISTILL_UNATTENDED_RECOVERY_STILL_FRAMES: "3"
      DISTILL_UNATTENDED_RECOVERY_STILL_POLL: "3"
      DISTILL_UNATTENDED_FRAME_INTERVAL: "60"
      DISTILL_UNATTENDED_INSTALL_REBOOT_TIMEOUT: ${{ inputs.install_reboot_timeout }}
      DISTILL_LEGACY_INSTALLPACKAGE_MODE: ${{ inputs.install_package_mode }}
      DISTILL_LEGACY_MATCHING_RECOVERY: "1"
      DISTILL_QEMU_CPU_PROFILE: ${{ inputs.qemu_cpu_profile }}
      DISTILL_QEMU_CPU_MODEL: ${{ inputs.qemu_cpu_model }}
      DISTILL_BATCH_JSON: ${{ inputs.batch }}
      DISTILL_LEGACY_BOOTSTRAP: ${{ vars.DISTILL_LEGACY_BOOTSTRAP }}
      DISTILL_OPENCORE_DIR: ${{ vars.DISTILL_OPENCORE_DIR }}
      DISTILL_OPENCORE_ARCHIVE_URL: ${{ vars.DISTILL_OPENCORE_ARCHIVE_URL }}
      DISTILL_OPENCORE_ARCHIVE_SHA256: ${{ vars.DISTILL_OPENCORE_ARCHIVE_SHA256 }}
      DISTILL_HOMEBREW_INSTALLER_URL: ${{ vars.DISTILL_HOMEBREW_INSTALLER_URL }}
      DISTILL_HOMEBREW_INSTALLER_SHA256: ${{ vars.DISTILL_HOMEBREW_INSTALLER_SHA256 }}
      DISTILL_QEMU_CODE_URL: ${{ vars.DISTILL_QEMU_CODE_URL }}
      DISTILL_QEMU_CODE_SHA256: ${{ vars.DISTILL_QEMU_CODE_SHA256 }}
      DISTILL_QEMU_VARS_URL: ${{ vars.DISTILL_QEMU_VARS_URL }}
      DISTILL_QEMU_VARS_SHA256: ${{ vars.DISTILL_QEMU_VARS_SHA256 }}
      DISTILL_RELEASE_BUILD: "1"
      DISTILL_VERIFY_AFTER_BUILD: "0"
      DISTILL_OPENCORE_STRICT: "1"
      DISTILL_CREATE_OPENCORE_DISK: "1"
      DISTILL_REQUIRE_GUEST_SSH_IDENTITY: "1"
      DISTILL_GUEST_SSH_TARGET: distill@127.0.0.1
      DISTILL_GUEST_SSH_PORT: "2222"
      DISTILL_QEMU_ARGS_JSON: ${{ secrets.DISTILL_QEMU_ARGS_JSON }}
      DISTILL_QEMU_DISK_ROTATION_RATE: ${{ inputs.qemu_disk_rotation_rate }}
      DISTILL_QEMU_DISK_CACHE: ${{ inputs.qemu_disk_cache }}
      DISTILL_QEMU_DISK_PROFILE: ${{ inputs.qemu_disk_profile }}
      DISTILL_QEMU_DISK_DEVICE: ${{ inputs.qemu_disk_device }}
      DISTILL_LEGACY_INSTALL_TARGET_MODE: ${{ inputs.install_target_mode }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_ARTIFACT_DOMAIN: ${{ vars.DISTILL_ARTIFACT_DOMAIN }}
      HOMEBREW_ARTIFACT_DOMAIN_NO_FALLBACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Prepare installer metadata cache
        run: mkdir -p out/hvf

      - name: Restore installer catalog metadata
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: out/hvf/installer-catalog-cache.json
          key: brew-distill-installer-catalog-${{ inputs.installer_version }}-${{ github.run_id }}
          restore-keys: |
            brew-distill-installer-catalog-${{ inputs.installer_version }}-

      - name: Prepare OpenCore input
        run: |
          if [ -n "$DISTILL_OPENCORE_DIR" ]; then
            test -d "$DISTILL_OPENCORE_DIR"
          else
            test -n "$DISTILL_OPENCORE_ARCHIVE_URL" || {
              echo "Legacy requires DISTILL_OPENCORE_DIR or DISTILL_OPENCORE_ARCHIVE_URL" >&2
              exit 1
            }
            test -n "$DISTILL_OPENCORE_ARCHIVE_SHA256" || {
              echo "Legacy requires DISTILL_OPENCORE_ARCHIVE_SHA256 for archive verification" >&2
              exit 1
            }
            source_dir="$RUNNER_TEMP/brew-distill-opencore"
            ./scripts/hvf/fetch-opencore \
              "$DISTILL_OPENCORE_ARCHIVE_URL" \
              "$DISTILL_OPENCORE_ARCHIVE_SHA256" \
              "$source_dir"
            printf '%s\n' "DISTILL_OPENCORE_DIR=$source_dir" >> "$GITHUB_ENV"
          fi

      - name: Prepare guest SSH credentials
        env:
          DISTILL_GUEST_SSH_PRIVATE_KEY: ${{ secrets.DISTILL_GUEST_SSH_PRIVATE_KEY }}
          DISTILL_GUEST_SSH_KNOWN_HOSTS_TEXT: ${{ secrets.DISTILL_GUEST_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$DISTILL_GUEST_SSH_PRIVATE_KEY" || {
            echo "Legacy requires the DISTILL_GUEST_SSH_PRIVATE_KEY secret" >&2
            exit 1
          }
          key="$RUNNER_TEMP/brew-distill-guest-key"
          public_key="$RUNNER_TEMP/brew-distill-guest-key.pub"
          printf '%s\n' "$DISTILL_GUEST_SSH_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          ssh-keygen -y -P '' -f "$key" > "$public_key"
          chmod 644 "$public_key"
          test -s "$public_key"
          {
            printf '%s\n' "DISTILL_GUEST_SSH_IDENTITY=$key"
            printf '%s\n' "DISTILL_GUEST_SSH_PUBLIC_KEY_FILE=$public_key"
          } >> "$GITHUB_ENV"
          if [ -n "$DISTILL_GUEST_SSH_KNOWN_HOSTS_TEXT" ]; then
            known_hosts="$RUNNER_TEMP/brew-distill-known-hosts"
            printf '%s\n' "$DISTILL_GUEST_SSH_KNOWN_HOSTS_TEXT" > "$known_hosts"
            chmod 600 "$known_hosts"
            printf '%s\n' "DISTILL_GUEST_KNOWN_HOSTS=$known_hosts" >> "$GITHUB_ENV"
          fi

      - name: Validate Legacy inputs
        run: |
          case "$DISTILL_UNATTENDED_INSTALL_REBOOT_TIMEOUT" in
            ''|*[!0-9]*)
              echo "Legacy install reboot timeout must be an integer" >&2
              exit 1
              ;;
          esac
          test "$DISTILL_UNATTENDED_INSTALL_REBOOT_TIMEOUT" -ge 60 || {
            echo "Legacy install reboot timeout must be at least 60 seconds" >&2
            exit 1
          }
          case "$DISTILL_QEMU_DISK_CACHE" in
            writeback|unsafe) ;;
            *)
              echo "Legacy QEMU disk cache must be writeback or unsafe" >&2
              exit 1
              ;;
          esac
          case "$DISTILL_QEMU_DISK_ROTATION_RATE" in
            0|1) ;;
            *)
              echo "Legacy QEMU disk rotation rate must be 0 or 1" >&2
              exit 1
              ;;
          esac
          case "$DISTILL_QEMU_DISK_PROFILE" in
            current|tuned|raw) ;;
            *)
              echo "Legacy QEMU disk profile must be current, tuned, or raw" >&2
              exit 1
              ;;
          esac
          case "$DISTILL_LEGACY_INSTALLPACKAGE_MODE" in
            required|omit) ;;
            *)
              echo "Legacy install package mode must be required or omit" >&2
              exit 1
              ;;
          esac
          case "$DISTILL_QEMU_CPU_PROFILE" in
            current|4vcpu|6vcpu) ;;
            *)
              echo "Legacy QEMU CPU profile must be current, 4vcpu, or 6vcpu" >&2
              exit 1
              ;;
          esac
          case "$DISTILL_QEMU_CPU_MODEL" in
            current|host) ;;
            *)
              echo "Legacy QEMU CPU model must be current or host" >&2
              exit 1
              ;;
          esac
          case "$DISTILL_QEMU_DISK_DEVICE" in
            sata|nvme) ;;
            *)
              echo "Legacy QEMU disk device must be sata or nvme" >&2
              exit 1
              ;;
          esac
          case "$DISTILL_LEGACY_INSTALL_TARGET_MODE" in
            auto|volume|eraseinstall) ;;
            *)
              echo "Legacy install target mode must be auto, volume, or eraseinstall" >&2
              exit 1
              ;;
          esac
          test -n "$HOMEBREW_ARTIFACT_DOMAIN" || {
            echo "Legacy requires the DISTILL_ARTIFACT_DOMAIN repository variable" >&2
            exit 1
          }
          case "$DISTILL_HOMEBREW_INSTALLER_URL" in
            https://?*) ;;
            *)
              echo "Legacy requires an HTTPS DISTILL_HOMEBREW_INSTALLER_URL repository variable" >&2
              exit 1
              ;;
          esac
          if [ "${#DISTILL_HOMEBREW_INSTALLER_SHA256}" -ne 64 ]; then
            echo "Legacy requires a 64-hex DISTILL_HOMEBREW_INSTALLER_SHA256 repository variable" >&2
            exit 1
          fi
          case "$DISTILL_HOMEBREW_INSTALLER_SHA256" in
            *[!0-9a-fA-F]*)
              echo "Legacy requires a 64-hex DISTILL_HOMEBREW_INSTALLER_SHA256 repository variable" >&2
              exit 1
              ;;
          esac
          test -n "$DISTILL_LEGACY_BOOTSTRAP" || {
            echo "Legacy requires the DISTILL_LEGACY_BOOTSTRAP repository variable" >&2
            exit 1
          }
          if [ ! -x "$DISTILL_LEGACY_BOOTSTRAP" ]; then
            bootstrap_path=$(command -v "$DISTILL_LEGACY_BOOTSTRAP" 2>/dev/null || true)
            test -n "$bootstrap_path" || {
              echo "Legacy bootstrap hook is not executable: $DISTILL_LEGACY_BOOTSTRAP" >&2
              exit 1
            }
          fi
          test -d "$DISTILL_OPENCORE_DIR" || {
            echo "Legacy OpenCore input is unavailable: $DISTILL_OPENCORE_DIR" >&2
            exit 1
          }
          test -n "$DISTILL_QEMU_ARGS_JSON" || {
            echo "Legacy requires the DISTILL_QEMU_ARGS_JSON secret" >&2
            exit 1
          }
          printf '%s' "$DISTILL_QEMU_ARGS_JSON" | jq -e \
            'type == "array" and length > 0 and all(.[]; type == "string")' >/dev/null
          printf '%s' "$DISTILL_QEMU_ARGS_JSON" | jq -e \
            'any(.[]; . == "-accel=hvf") or ([range(0; length - 1) as $i | .[$i] == "-accel" and .[$i + 1] == "hvf"] | any)' >/dev/null || {
            echo "DISTILL_QEMU_ARGS_JSON must request -accel hvf" >&2
            exit 1
          }
          if printf '%s' "$DISTILL_QEMU_ARGS_JSON" | jq -e 'any(.[]; contains("{{QEMU_CODE}}"))' >/dev/null; then
            test -n "$DISTILL_QEMU_CODE_URL" || {
              echo "Legacy requires DISTILL_QEMU_CODE_URL when QEMU_CODE is a placeholder" >&2
              exit 1
            }
            test "${#DISTILL_QEMU_CODE_SHA256}" -eq 64 || {
              echo "Legacy requires a 64-hex DISTILL_QEMU_CODE_SHA256" >&2
              exit 1
            }
          fi
          if printf '%s' "$DISTILL_QEMU_ARGS_JSON" | jq -e 'any(.[]; contains("{{QEMU_VARS}}"))' >/dev/null; then
            test -n "$DISTILL_QEMU_VARS_URL" || {
              echo "Legacy requires DISTILL_QEMU_VARS_URL when QEMU_VARS is a placeholder" >&2
              exit 1
            }
            test "${#DISTILL_QEMU_VARS_SHA256}" -eq 64 || {
              echo "Legacy requires a 64-hex DISTILL_QEMU_VARS_SHA256" >&2
              exit 1
            }
          fi
          test -f "$DISTILL_GUEST_SSH_IDENTITY" || {
            echo "Legacy guest SSH identity was not prepared" >&2
            exit 1
          }
          test -s "$DISTILL_GUEST_SSH_PUBLIC_KEY_FILE" || {
            echo "Legacy guest SSH public key was not prepared" >&2
            exit 1
          }
          config="$DISTILL_OPENCORE_DIR/EFI/OC/config.plist"
          test -f "$config" || {
            echo "Legacy OpenCore input has no config.plist" >&2
            exit 1
          }
          test -f "$DISTILL_OPENCORE_DIR/EFI/BOOT/BOOTx64.efi" || {
            echo "Legacy OpenCore input lacks EFI/BOOT/BOOTx64.efi" >&2
            exit 1
          }
          test -f "$DISTILL_OPENCORE_DIR/EFI/OC/OpenCore.efi" || {
            echo "Legacy OpenCore input lacks EFI/OC/OpenCore.efi" >&2
            exit 1
          }
          plutil -lint "$config" >/dev/null || {
            echo "Legacy OpenCore config.plist is invalid: $config" >&2
            exit 1
          }

      - name: Authorize Homebrew bottle downloads
        run: |
          token=$(./scripts/homebrew-ghcr-token qemu aria2 $(printf '%s' "$DISTILL_BATCH_JSON" | jq -r '.formulas[]'))
          echo "::add-mask::$token"
          printf '%s\n' "HOMEBREW_DOCKER_REGISTRY_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Prepare Draft Release
        run: |
          set -eu
          tag="distill-legacy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "$tag" \
            --notes "Legacy Bottle build in progress for $GITHUB_REPOSITORY@$GITHUB_SHA"
          printf '%s\n' "DISTILL_RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Install QEMU
        run: brew install qemu aria2

      - name: Run Legacy PoC
        run: |
          printf '%s\n' "$DISTILL_BATCH_JSON" > legacy-batch.json
          case "$DISTILL_QEMU_DISK_PROFILE" in
            current) ;;
            tuned)
              export DISTILL_BASE_QCOW2_OPTIONS='cluster_size=2M,preallocation=metadata,lazy_refcounts=on'
              ;;
            raw)
              export DISTILL_BASE_FORMAT=raw
              ;;
          esac
          if [ "$DISTILL_LEGACY_INSTALLPACKAGE_MODE" = omit ]; then
            export DISTILL_GUEST_SSH_TIMEOUT=60
          fi
          DISTILL_VERIFY_AFTER_BUILD=0 \
          DISTILL_LEGACY_OUTPUT_DIR=out \
            ./scripts/hvf/legacy-poc "$DISTILL_MACOS" legacy-batch.json

      - name: Upload Bottle and verification metadata to Draft Release
        if: success()
        run: |
          set -eu
          assets=()
          while IFS= read -r asset; do
            [ -f "$asset" ] || continue
            assets+=("$asset")
          done < <(find out/artifacts -maxdepth 1 -type f \( \
            -name '*.bottle*.tar.gz' -o \
            -name '*.bottle.json' -o \
            -name '*.manifest.json' \
          \) -print | sort)
          [ "${#assets[@]}" -gt 0 ]
          upload_started=$(date +%s)
          gh release upload "$DISTILL_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "${assets[@]}"
          ./scripts/hvf/record-timing out/hvf/phase-timings.json bottle_upload \
            "$(( $(date +%s) - upload_started ))"

      - name: Verify Bottles from Draft Release
        run: |
          set -eu
          mkdir -p draft-release verification
          gh release download "$DISTILL_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.manifest.json' \
            --pattern '*.bottle*.tar.gz' \
            --dir draft-release
          records='[]'
          for manifest in draft-release/*.manifest.json; do
            [ -f "$manifest" ] || continue
            formula=$(jq -er '.formula.name' "$manifest")
            bottle_name=$(jq -er '.artifact.path' "$manifest")
            expected=$(jq -er '.artifact.sha256' "$manifest")
            case "$bottle_name" in
              /*|*/*|..*)
                echo "manifest contains an unsafe Bottle path: $bottle_name" >&2
                exit 1
                ;;
            esac
            bottle="draft-release/$bottle_name"
            test -f "$bottle"
            DISTILL_BOTTLE_SHA256="$expected" \
            DISTILL_QEMU_CONFIG=out/hvf/.qemu-runtime.json \
            DISTILL_OPENCORE_DISK=out/hvf/opencore.img \
            DISTILL_PHASE_TIMINGS=out/hvf/phase-timings.json \
              ./scripts/hvf/verify-bottle "$formula" "$bottle" \
                out/hvf/base.qcow2 "verification/$formula"
            records=$(printf '%s\n' "$records" | jq -c \
              --arg formula "$formula" --arg sha256 "$expected" \
              '. + [{formula:$formula,sha256:$sha256,status:"passed",fresh_overlay:true}]')
          done
          test "$records" != '[]'
          jq -n \
            --arg run "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg macos "$DISTILL_MACOS" \
            --argjson records "$records" \
            --slurpfile batch out/artifacts/batch-results.json \
            --slurpfile timings out/artifacts/timings.json \
            --slurpfile phase_timings out/hvf/phase-timings.json \
            --slurpfile qemu_launch out/hvf/qemu-launch.json \
            '{schema:1,run:$run,commit:$sha,platform:{macos:$macos,arch:"x86_64"},verification:{fresh_overlay:true,status:"passed",records:$records},batch:$batch[0],timings:$timings[0],phase_timings:$phase_timings[0],qemu_launch:$qemu_launch[0]}' \
            > legacy-verification.json
          upload_started=$(date +%s)
          gh release upload "$DISTILL_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            legacy-verification.json
          ./scripts/hvf/record-timing out/hvf/phase-timings.json bottle_upload \
            "$(( $(date +%s) - upload_started ))"

      - name: Upload diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-${{ inputs.macos }}-${{ github.run_id }}
          path: |
            out/diagnostics.json
            out/hvf/host-info.json
            out/hvf/disk-*.txt
            out/hvf/disk-*.json
            out/hvf/reclaim.json
            out/hvf/reclaim.txt
            out/hvf/installer.json
            out/hvf/installer-capabilities.json
            out/hvf/installer-app-info.txt
            out/hvf/startosinstall-usage.txt
            out/hvf/startosinstall-command.txt
            out/hvf/startosinstall-package-info.txt
            out/hvf/diskutil-list.txt
            out/hvf/target-disk-info.txt
            out/hvf/target-volume-info.txt
            out/hvf/csrutil-status.txt
            out/hvf/nvram-diagnostics.txt
            out/hvf/startosinstall-environment.txt
            out/hvf/network-diagnostics.txt
            out/hvf/startosinstall-events.log
            out/hvf/startosinstall-watch.log
            out/hvf/install-script.log
            out/hvf/install-script.status
            out/hvf/startosinstall.log
            out/hvf/startosinstall-stderr.log
            out/hvf/install-system.log
            out/hvf/install-media-attach.log
            out/hvf/recovery-image.json
            out/hvf/recovery-system-version.txt
            out/hvf/recovery-version-attach.log
            out/hvf/matching-recovery.log
            out/hvf/recovery-download.log
            out/hvf/unattended-frames.jsonl
            out/hvf/qmp-events.jsonl
            out/hvf/qemu-blockstats.jsonl
            out/hvf/screen-*.ppm
            out/hvf/full-installers.txt
            out/hvf/installer-package.log
            out/hvf/installer-catalog-cache.json
            out/hvf/phase-timings.json
            out/hvf/base.json
            out/hvf/base-create.json
            out/hvf/base-check.txt
            out/hvf/opencore-disk.json
            out/hvf/ssh-client.json
            out/hvf/ssh-ready.json
            out/hvf/firstboot.log
            out/hvf/legacy-bootstrap.json
            out/hvf/unattended-install.json
            out/hvf/unattended-install.log
            out/hvf/homebrew-install.log
            out/hvf/homebrew-bootstrap.log
            out/hvf/brew-version.txt
            out/hvf/brew-config.txt
            out/hvf/brew-doctor.txt
            out/hvf/guest-console.log
            out/hvf/qemu.log
            out/hvf/qemu-launch.json
            out/hvf/opencore.log
            !out/**/*.qcow2
            !out/**/*.img
            !out/**/*.raw
          if-no-files-found: warn

      - name: Summarize timings
        if: always()
        run: |
          set -eu
          printf '%s\n' '## Legacy phase timings' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '| Phase | Time |' '| --- | ---: |' >> "$GITHUB_STEP_SUMMARY"
          timing_file=out/hvf/phase-timings.json
          for phase in \
            catalog_resolve installer_download installer_checksum installer_pkg_install installer_discovery \
            recovery_image_download matching_recovery_prepare install_media_prepare bootstrap_pkg_build installer_tree_copy install_media_dmg_create \
            recovery_dmg_convert firmware_prepare guest_boot guest_install guest_ssh_wait brew_bootstrap \
            formula_build bottle_create bottle_upload bottle_verify; do
            seconds=0
            if [ -s "$timing_file" ]; then
              seconds=$(jq -r --arg phase "$phase" '.phases[$phase] // 0' "$timing_file")
            fi
            printf '| %s | %ss |\n' "$phase" "$seconds" >> "$GITHUB_STEP_SUMMARY"
          done
